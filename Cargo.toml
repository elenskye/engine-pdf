[package]
name = "engine-pdf"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Peck、Pith、Pomelo 共用的 Mac PDF 引擎：打开、取字、渲染、本机 OCR、Mathpix 识别"
license = "UNLICENSED"
publish = false

[features]
samples = ["dep:objc2-core-text", "objc2-core-foundation/CFAttributedString", "objc2-core-foundation/CFData", "objc2-core-foundation/CFDictionary", "objc2-core-foundation/CFString", "objc2-core-graphics/CGDataConsumer", "objc2-core-graphics/CGPDFContext"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "^0.6.5"
objc2-foundation = { version = "^0.3.2", default-features = false, features = ["std", "NSData", "NSDictionary", "NSString", "NSValue"] }
objc2-pdf-kit = { version = "^0.3.2", default-features = false, features = ["std", "PDFDocument", "PDFPage", "objc2-core-graphics"] }
objc2-app-kit = { version = "^0.3.2", default-features = false, features = ["std", "NSBitmapImageRep", "NSImageRep", "objc2-core-graphics"] }
objc2-core-foundation = { version = "^0.3.2", default-features = false, features = ["std"] }
objc2-core-graphics = { version = "^0.3.2", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGGeometry", "CGImage", "CGPDFDictionary", "CGPDFDocument", "CGPDFObject", "CGPDFPage", "CGPDFStream"] }
objc2-core-text = { version = "^0.3.2", optional = true, default-features = false, features = ["std", "CTFont", "CTLine", "CTStringAttributes", "objc2-core-graphics"] }

[[example]]
name = "make_samples"
required-features = ["samples"]
