<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Engine PDF Studio</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/pdfjs/web/pdf_viewer.css">
  <link rel="stylesheet" href="/studio.css">
  <script type="importmap">
    {"imports":{"pdfjs-dist":"/pdfjs/build/pdf.mjs","pdfjs-dist/web/pdf_viewer.mjs":"/pdfjs/web/pdf_viewer.mjs"}}
  </script>
  <script type="module" src="/studio.mjs"></script>
</head>
<body>
  <header class="header">
    <h1>Engine PDF Studio</h1>
    <span id="document-name" class="document-name">尚未打开 PDF</span>
    <label class="button">打开 PDF<input id="open" type="file" accept="application/pdf,.pdf" hidden></label>
    <button type="button" id="searchable" disabled>生成可搜索副本</button>
    <button type="button" id="save" class="primary" disabled>保存副本</button>
  </header>
  <div class="toolbar" aria-label="编辑工具">
    <div id="tools" class="buttons">
      <button data-tool="select" aria-pressed="true">选择</button>
      <button data-tool="highlight">高亮</button>
      <button data-tool="underline">下划线</button>
      <button data-tool="strikeout">删除线</button>
      <button data-tool="note">便签</button>
      <button data-tool="textBox">文本框</button>
      <button data-tool="ink">绘图</button>
      <button data-tool="rectangle">矩形</button>
      <button data-tool="ellipse">椭圆</button>
      <button data-tool="line">直线</button>
      <button data-tool="arrow">箭头</button>
      <button data-tool="link">链接</button>
      <button id="add-image">图片</button>
      <button id="add-signature">签名</button>
      <button data-tool="object" data-pdfium hidden>选对象</button>
      <button data-tool="redact" data-pdfium hidden>涂黑</button>
    </div>
    <div class="buttons">
      <label>颜色 <input id="color" type="color" value="#db382b"></label>
      <label>透明度 <input id="opacity" type="range" min="0.1" max="1" step="0.05" value="1"></label>
      <label>线宽 <input id="width" type="number" min="1" max="24" value="2"></label>
      <label>字号 <input id="font-size" type="number" min="6" max="72" value="14"></label>
      <button id="undo">撤销</button><button id="redo">重做</button>
      <button id="delete-selected">删除选中标注</button>
    </div>
    <div class="buttons" id="note-options" hidden>
      <label>批注文字 <input id="note-text" type="text"></label>
      <button id="apply-comment">附到选中标注</button>
    </div>
    <div class="buttons" id="link-options" hidden>
      <label>目标 <select id="link-kind"><option value="page">输出页</option><option value="url">网址</option></select></label>
      <label>目标值 <input id="link-target" value="1"></label>
      <label>纵坐标 <input id="link-y" type="number" value="300"></label>
    </div>
    <input id="image-file" type="file" accept="image/png,image/jpeg" hidden>
  </div>
  <div class="workspace">
    <aside class="sidebar">
      <details open>
        <summary>页面整理</summary>
        <div class="buttons section-actions">
          <label class="button">插入 PDF<input id="insert" type="file" accept="application/pdf,.pdf" hidden></label>
          <button id="page-up" aria-label="页面上移">↑</button>
          <button id="page-down" aria-label="页面下移">↓</button>
          <button id="page-rotate">旋转</button><button id="page-duplicate">复制</button><button id="page-remove">删除页</button>
        </div>
        <ol id="pages" class="pages"></ol>
      </details>
      <details id="outline-panel">
        <summary>目录</summary>
        <div id="outline"></div>
        <label>标题 <input id="outline-title" type="text"></label>
        <div class="buttons section-actions">
          <button id="outline-add">新增</button><button id="outline-child">新增下级</button>
          <button id="outline-rename">改名</button><button id="outline-remove">删除目录项</button>
          <button id="outline-up">上移</button><button id="outline-down">下移</button>
          <button id="outline-promote">提升一级</button><button id="outline-indent">降一级</button>
        </div>
      </details>
      <details id="annotations-panel">
        <summary>当前页已有标注</summary>
        <ul id="annotations" class="annotations"></ul>
      </details>
      <details>
        <summary>文档信息</summary>
        <label>标题 <input id="title" type="text"></label>
        <label>作者 <input id="author" type="text"></label>
        <label>主题 <input id="subject" type="text"></label>
        <label>关键词 <input id="keywords" type="text" placeholder="以逗号分隔"></label>
        <label>创建工具 <input id="creator" type="text"></label>
      </details>
      <details id="save-options">
        <summary>保存选项</summary>
        <button id="source-password" type="button" hidden>输入所选来源的权限密码</button>
        <label><input id="flatten" type="checkbox"> 烧平标注和表单</label>
        <label>密码 <select id="security">
          <option value="none">保留现状</option><option value="lock">设置或更换密码</option><option value="remove">去掉密码</option>
        </select></label>
        <div id="lock-options" hidden>
          <label>新权限密码 <input id="owner-password" type="password" autocomplete="new-password"></label>
          <label>新打开密码 <input id="user-password" type="password" autocomplete="new-password"></label>
          <div class="buttons">
            <label><input id="allow-print" type="checkbox" checked> 打印</label>
            <label><input id="allow-copy" type="checkbox" checked> 复制</label>
            <label><input id="allow-modify" type="checkbox" checked> 修改</label>
            <label><input id="allow-annotate" type="checkbox" checked> 批注</label>
          </div>
        </div>
      </details>
    </aside>
    <main class="reader">
      <div class="navigation buttons">
        <button id="previous-page" aria-label="上一页">‹</button>
        <label>物理页 <input id="page-number" type="number" min="1" value="1"></label>
        <span id="page-count"></span>
        <button id="next-page" aria-label="下一页">›</button>
        <button id="zoom-out" aria-label="缩小">−</button><button id="zoom-in" aria-label="放大">＋</button>
        <button id="fit-width">适合宽度</button><output id="scale"></output>
        <input id="search" type="search" aria-label="查找 PDF 文字" placeholder="查找文字">
        <button id="find-submit" disabled>查找</button>
        <button id="find-previous" disabled>上一个</button><button id="find-next" disabled>下一个</button><output id="find-count" aria-live="polite"></output>
      </div>
      <div class="viewport">
        <div id="empty">打开 PDF 开始编辑</div>
        <div id="viewer-container"><div id="viewer" class="pdfViewer"></div></div>
      </div>
    </main>
  </div>
  <footer class="status"><span id="status" role="status" aria-live="polite"></span><a id="download" hidden>下载副本</a></footer>

  <dialog id="unlock-dialog">
    <form method="dialog">
      <h2 id="unlock-title">打开加密 PDF</h2>
      <label>PDF 密码 <input id="open-password" type="password" autocomplete="off" autofocus></label>
      <div class="buttons"><button value="cancel">取消</button><button class="primary" value="open">打开</button></div>
    </form>
  </dialog>
  <dialog id="searchable-dialog" aria-labelledby="searchable-title">
    <form method="dialog">
      <h2 id="searchable-title">生成可搜索副本</h2>
      <label>物理页码 <input id="ocr-pages" required placeholder="例如 1,3-5" autofocus></label>
      <p>在本机识别所选页。首次加载识别模型可能需要几十秒。</p>
      <div class="buttons">
        <button value="cancel" formnovalidate>取消</button>
        <button class="primary" value="convert">转换并保存</button>
      </div>
    </form>
  </dialog>
  <dialog id="redact-dialog" aria-labelledby="redact-title">
    <form method="dialog">
      <h2 id="redact-title">确认涂黑</h2>
      <p id="redact-summary"></p>
      <p>引擎会永久移除框内的页面内容并另存副本。文件信息、书签和附件可能仍含相同内容。</p>
      <div class="buttons">
        <button value="cancel" autofocus>取消</button>
        <button class="primary" value="redact">涂黑并保存</button>
      </div>
    </form>
  </dialog>
  <dialog id="signature-dialog">
    <form method="dialog">
      <h2>添加签名</h2>
      <label>方式 <select id="signature-kind"><option value="text">打字</option><option value="draw">手绘</option><option value="image">图片</option></select></label>
      <label id="signature-text-panel">签名 <input id="signature-text" type="text" autofocus></label>
      <div id="signature-draw-panel" hidden>
        <canvas id="signature-pad" width="340" height="120" aria-label="签名画板"></canvas>
        <button type="button" id="clear-signature">重画</button>
      </div>
      <label id="signature-image-panel" hidden>签名图片 <input id="signature-file" type="file" accept="image/*"></label>
      <div class="buttons"><button value="cancel">取消</button><button class="primary" value="insert">插入签名</button></div>
    </form>
  </dialog>
</body>
</html>
